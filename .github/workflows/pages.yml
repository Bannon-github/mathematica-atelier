name: Deploy Mathematica Atelier to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/modules/navigation.js
          node --check assets/js/modules/panels.js
          node --check assets/js/modules/token-editor.js
          node --check assets/js/modules/quadratic-roots.js
          node --check assets/js/modules/smoke-test.js
      - name: Check site assets
        run: |
          test -s index.html
          test -s assets/css/atelier.css
          test -s assets/js/app.js
          test -s assets/js/modules/navigation.js
          test -s assets/js/modules/panels.js
          test -s assets/js/modules/token-editor.js
          test -s assets/js/modules/quadratic-roots.js
          test -s assets/css/quadratic-roots.css
          test -s assets/js/modules/smoke-test.js
          test -s assets/css/token-mockup.css
          grep -q 'assets/css/atelier.css' index.html
          grep -q 'assets/js/app.js' index.html
          grep -q 'token-editor.js' index.html
          grep -q 'token-mockup.css' index.html
          grep -q 'quadratic-roots.css' index.html

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare clean site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
