<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematica Atelier</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet"><style>body{margin:0;background:#10101c;color:#f3e9e9;font-family:'Cormorant Garamond',serif;font-size:20px}header{padding:12px 24px;border-bottom:1px solid #5e4a67;font:36px 'Great Vibes',cursive}main{display:grid;grid-template-columns:250px 1fr 260px;height:calc(100vh - 70px)}aside{padding:16px;overflow:auto;background:#1b1929}section{position:relative}canvas{display:block;width:100%;height:100%}input,select,button{box-sizing:border-box;width:100%;padding:9px;margin:6px 0;background:#29243b;border:1px solid #806c8f;border-radius:8px;color:#fff;font:19px 'Cormorant Garamond',serif}button{cursor:pointer}label{display:block;margin-top:12px}h3{font-weight:400;color:#eac7df}#status{position:absolute;bottom:8px;left:14px;font-size:14px;color:#dcc6e3} @media(max-width:800px){main{display:block;height:auto}section{height:55vh}aside{min-height:180px}}</style></head><body><header>Mathematica Atelier</header><main><aside><h3>Equation Library</h3><p style='font-size:15px;opacity:.7'>Search curated mathematical surfaces</p><input id="search" placeholder="Search equations…"><div id="library"></div><h3>History</h3><select id="history"><option>Recent expressions</option></select></aside><section><canvas id="view"></canvas><div id="status">Drag to orbit · Scroll to zoom</div></section><aside><h3>Expression</h3><input id="expr" value="A*sin(f*x+t)*cos(g*y)"><button id="apply">Render expression</button><label><input type="checkbox" id="animateTime" checked style="width:auto"> Animate time</label><button id="snapshot">Save PNG image</button><h3>Expression components</h3><div id="components"></div><div id="params"></div><h3>Colour & atmosphere</h3><label>Colour expression (hue 0–1)</label><input id="hue" value="0.68 + 0.25*sin(z+t)"><label>Background colour expression (hue 0–1)</label><input id="bg" value="0.68+0.05*sin(t)"><label>Audio</label><button id="audio">Enable mathematical audio</button><p style="font-size:15px">Sound uses the average surface height to modulate an oscillator. Audio begins only after a click.</p></aside></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';import {compile,parse as parseMath} from 'https://esm.sh/mathjs@14.0.1';
const presets={'Wave interference':'A*sin(f*x+t)*cos(g*y)','Radial ripples':'A*sin(f*sqrt(x*x+y*y)-t)','Saddle':'A*(x*x-y*y)/12','Gaussian bell':'A*exp(-(x*x+y*y)/f)','Twisted surface':'A*sin(f*x*y/8+t)','Hyperbolic paraboloid':'A*x*y/7','Sombrero':'A*sin(f*sqrt(x*x+y*y))/(sqrt(x*x+y*y)+0.1)','Moiré interference':'A*(sin(f*x+t)+cos(g*y-t))','Standing waves':'A*sin(f*x)*sin(g*y)*cos(t)'};let history=[];const $=id=>document.getElementById(id);let parameters={A:2,f:1.5,g:1.5};const reserved=new Set(['x','y','z','t','sin','cos','tan','sqrt','exp','log','abs','pi','e','pow','min','max']);let expression,colour,bg;let componentNodes=[],componentEnabled={};let renderer,scene,camera,controls,mesh,geometry,material;let time=0,last=performance.now(),audioCtx,osc,gain,audioOn=false;
function makeCompiled(str){return compile(str)}
function buildComponents(){
 const tree=parseMath($('expr').value);let nodes=[];
 function walk(node){if(node.isOperatorNode&&['add','subtract'].includes(node.fn)){node.args.forEach(walk)}else nodes.push(node)}
 walk(tree);componentNodes=nodes;
 const host=$('components');host.replaceChildren();
 nodes.forEach((node,i)=>{const key=node.toString();if(!(key in componentEnabled))componentEnabled[key]=true;const line=document.createElement('label');line.style.cssText='display:flex;align-items:center;gap:8px;font-size:17px;overflow-wrap:anywhere';const cb=document.createElement('input');cb.type='checkbox';cb.style.width='auto';cb.checked=componentEnabled[key];cb.onchange=()=>{componentEnabled[key]=cb.checked;parse(false)};const span=document.createElement('span');span.textContent=key;line.append(cb,span);host.append(line)})
}
function effectiveExpression(){if(!componentNodes.length)return $('expr').value;return componentNodes.filter(n=>componentEnabled[n.toString()]!==false).map(n=>'('+n.toString()+')').join('+')||'0'}
function parse(rebuild=true){try{if(rebuild)buildComponents();expression=makeCompiled(effectiveExpression());colour=makeCompiled($('hue').value);bg=makeCompiled($('bg').value);const vars=($('expr').value.match(/[A-Za-z_][A-Za-z_0-9]*/g)||[]).filter(v=>!reserved.has(v));for(const v of new Set(vars))if(!(v in parameters))parameters[v]=1;for(const k of Object.keys(parameters))if(!vars.includes(k))delete parameters[k];$('params').innerHTML='';for(const [k,v] of Object.entries(parameters)){const label=document.createElement('label');label.textContent=k+' = '+v.toFixed(2);const slider=document.createElement('input');slider.type='range';slider.min='-8';slider.max='8';slider.step='.05';slider.value=v;slider.oninput=()=>{parameters[k]=+slider.value;label.textContent=k+' = '+slider.value};$('params').append(label,slider)}$('status').textContent='Drag to orbit · Scroll to zoom';return true}catch(e){$('status').textContent='Expression error: '+e.message;return false}}
function select(s){$('expr').value=s;apply()}function apply(){if(!parse())return;history=[ $('expr').value,...history.filter(v=>v!==$('expr').value)].slice(0,30);localStorage.setItem('atelierHistory',JSON.stringify(history));drawHistory()}function drawHistory(){$('history').innerHTML='<option value="">Recent expressions</option>';history.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;$('history').append(o)})}function library(q=''){$('library').innerHTML='';for(const [name,eq] of Object.entries(presets)){if(!(name+' '+eq).toLowerCase().includes(q.toLowerCase()))continue;const b=document.createElement('button');b.textContent=name;b.onclick=()=>select(eq);$('library').append(b)}}
$('search').oninput=e=>library(e.target.value);$('history').onchange=e=>{if(e.target.value)select(e.target.value)};$('apply').onclick=apply;let editTimer;$('expr').addEventListener('input',()=>{clearTimeout(editTimer);editTimer=setTimeout(()=>parse(),180)});$('snapshot').onclick=()=>{renderer.render(scene,camera);const link=document.createElement('a');link.download='mathematica-atelier.png';link.href=renderer.domElement.toDataURL('image/png');link.click()};$('expr').onkeydown=e=>{if(e.key==='Enter')apply()};$('hue').onchange=parse;$('bg').onchange=parse;library();try{history=JSON.parse(localStorage.getItem('atelierHistory')||'[]')}catch{}drawHistory();
scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,1,.1,200);camera.position.set(12,11,15);renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;controls=new OrbitControls(camera,$('view'));controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xe7dcff,0x1c1634,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(6,12,7);scene.add(light);geometry=new THREE.PlaneGeometry(14,14,120,120);geometry.rotateX(-Math.PI/2);material=new THREE.MeshStandardMaterial({side:THREE.DoubleSide,metalness:.25,roughness:.34,vertexColors:true});mesh=new THREE.Mesh(geometry,material);scene.add(mesh);const positions=geometry.attributes.position;const colors=new Float32Array(positions.count*3);geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));const colorObj=new THREE.Color();parse();
function evalSafe(comp,scope,fallback){try{const v=comp.evaluate(scope);return typeof v==='number'&&Number.isFinite(v)?v:fallback}catch{return fallback}}function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if($('animateTime').checked)time+=dt;let avg=0;for(let i=0;i<positions.count;i++){const x=positions.getX(i),y=positions.getZ(i),scope={...parameters,x,y,t:time};const z=Math.max(-12,Math.min(12,evalSafe(expression,scope,0)));positions.setY(i,z);avg+=z;const hue=((evalSafe(colour,{...scope,z},.7)%1)+1)%1;colorObj.setHSL(hue,.75,.55);colors[i*3]=colorObj.r;colors[i*3+1]=colorObj.g;colors[i*3+2]=colorObj.b}positions.needsUpdate=true;geometry.attributes.color.needsUpdate=true;geometry.computeVertexNormals();const h=((evalSafe(bg,{...parameters,t:time,x:0,y:0,z:0},.7)%1)+1)%1;scene.background=new THREE.Color().setHSL(h,.27,.09);if(audioOn&&osc){osc.frequency.setTargetAtTime(180+Math.abs(avg/positions.count)*110,audioCtx.currentTime,.07)}const r=$('view').getBoundingClientRect();if(r.width&&r.height){renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
$('audio').onclick=async()=>{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();osc=audioCtx.createOscillator();gain=audioCtx.createGain();osc.type='sine';gain.gain.value=.055;osc.connect(gain).connect(audioCtx.destination);osc.start()}await audioCtx.resume();audioOn=!audioOn;gain.gain.setTargetAtTime(audioOn?.055:0,audioCtx.currentTime,.05);$('audio').textContent=audioOn?'Mute mathematical audio':'Enable mathematical audio'};
</script></body></html>
